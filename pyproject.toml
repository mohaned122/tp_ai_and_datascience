[project]
name = "tp-ai-1"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "imutils>=0.5.4",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.0",
    "pandas-stubs~=3.1.0",
    "pygame>=2.6.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "torch==2.14.1+cu130",
    "tqdm>=4.70.1",
]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
